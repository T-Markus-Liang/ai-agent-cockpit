<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cezar — New task</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---------- sidebar extras ---------- */
  .side-newtask { padding: 4px 12px 8px; }
  .btn-newtask {
    width: 100%; justify-content: center; gap: 8px;
    background: var(--primary); color: var(--primary-foreground);
    filter: brightness(.94);
    box-shadow: inset 0 1px 2px color-mix(in srgb, var(--primary-foreground) 22%, transparent),
                0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent);
  }
  .side-foot .theme-btn {
    margin-left: auto; width: 28px; height: 28px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted-foreground); border: 1px solid var(--border);
  }
  .side-foot .theme-btn:hover { background: var(--muted); color: var(--foreground); }
  .tools-chip { height: 24px; padding: 0 9px; font-size: 11.5px; }
  .tools-chip .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .ver { font: 500 11px var(--mono); color: var(--soft-foreground); }

  /* ---------- hero ---------- */
  .hero {
    position: relative; flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(32px, 7vh, 84px) 24px 64px;
  }
  .twinkles {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    mask-image: linear-gradient(to bottom, black 25%, transparent 88%);
    -webkit-mask-image: linear-gradient(to bottom, black 25%, transparent 88%);
  }
  .tw { position: absolute; border-radius: 1px; }
  .tw-2 { width: 2px; height: 2px; }
  .tw-3 { width: 3px; height: 3px; }
  .tw-lime   { background: var(--primary); }
  .tw-violet { background: var(--violet); }
  .tw-yellow { background: var(--pending); }

  .composer-wrap { position: relative; z-index: 1; width: 100%; max-width: 720px; }

  .hero-head { text-align: center; margin-bottom: 22px; }
  .hero-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .hero-sub { margin-top: 6px; font-size: 13.5px; color: var(--muted-foreground); }

  /* ---------- composer card ---------- */
  .composer-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-md), var(--shadow-xs);
    padding: 18px 18px 14px; overflow: visible; position: relative;
  }
  .composer-input {
    width: 100%; border: none; background: transparent; outline: none; resize: none;
    font: 400 16px/1.55 var(--sans); color: var(--foreground); padding: 0;
  }

  .attach-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; }
  .attach-thumb {
    position: relative; width: 52px; height: 40px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--card-2); flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--soft-foreground);
  }
  .attach-thumb::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--grad); opacity: .16;
  }
  .attach-name { font: 500 11.5px var(--mono); color: var(--muted-foreground); }
  .attach-x {
    width: 20px; height: 20px; border-radius: 999px; display: inline-flex;
    align-items: center; justify-content: center; color: var(--soft-foreground);
  }
  .attach-x:hover { background: var(--muted); color: var(--foreground); }

  .controls {
    display: flex; align-items: center; gap: 10px; row-gap: 10px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .controls-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  @media (min-width: 768px) { .controls-left { flex-wrap: nowrap; } }
  .controls-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
  .chip .chev { color: var(--soft-foreground); }
  .chip.skill { font-family: var(--mono); font-size: 11.5px; }
  .chip.skill svg { color: var(--violet); }
  .chip .mono { font-family: var(--mono); font-size: 11.5px; }

  .dictate { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px;
    border-radius: var(--radius-sm); color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
  .dictate:hover { background: var(--muted); color: var(--foreground); }

  .seg .plan-active {
    background: var(--contrast); color: var(--contrast-foreground); font-weight: 600;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 55%, transparent);
  }
  html:not(.light) .seg > button.plan-active { background: var(--contrast); }

  .submit-group { display: inline-flex; align-items: center; gap: 8px; }

  /* ---------- skill picker dropdown (static open) ---------- */
  .skill-menu {
    position: absolute; left: 18px; top: calc(100% + 8px); z-index: 40;
    width: 336px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); overflow: hidden;
  }
  .skill-search {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); color: var(--soft-foreground);
  }
  .skill-search input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 13px; color: var(--foreground); padding: 0;
  }
  .menu-group { padding: 6px 0 4px; }
  .menu-group + .menu-group { border-top: 1px solid var(--border); }
  .menu-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--soft-foreground); padding: 6px 12px 3px; }
  .menu-item { display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 12px; text-align: left; }
  .menu-item:hover { background: var(--muted); }
  .menu-item.selected { background: var(--muted); }
  .menu-item .mi-body { flex: 1; min-width: 0; }
  .menu-item .mi-name { font: 600 12px var(--mono); color: var(--foreground); }
  .menu-item.reg .mi-name { font-weight: 400; }
  .menu-item .mi-desc { font-size: 11.5px; color: var(--muted-foreground);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .menu-item .mi-check { color: var(--primary); flex: none; }

  /* ---------- suggestions ---------- */
  .suggest-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 28px; }
  .suggest {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--border); background: transparent;
    font-size: 12.5px; font-weight: 500; color: var(--muted-foreground);
  }
  .suggest:hover { background: var(--muted); color: var(--foreground); }
  .suggest svg { color: var(--soft-foreground); }

  /* ---------- mobile top bar bits ---------- */
  .mobile-top .mt-title { font-size: 14.5px; font-weight: 600; }
  .mobile-top .mt-btn { width: 36px; height: 36px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: var(--radius-sm); color: var(--muted-foreground); }
  .mobile-top .mt-btn:hover { background: var(--muted); }
  .mobile-top .mt-spacer { flex: 1; }

  /* ---------- mobile ---------- */
  @media (max-width: 767px) {
    .hero { padding: 26px 14px calc(40px + env(safe-area-inset-bottom)); }
    .hero-title { font-size: 16px; }
    .hero-sub { font-size: 12.5px; }
    .hero-head { margin-bottom: 16px; }
    .composer-card { padding: 14px 14px 12px; }
    .composer-input { font-size: 16px; }
    .controls { flex-wrap: wrap; row-gap: 10px; }
    .controls-right { margin-left: 0; width: 100%; justify-content: space-between; }
    .skill-menu { display: none; }
    .suggest-row { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ================= sidebar ================= -->
  <aside class="sidebar">
    <div class="side-head">
      <span class="brand-tile">c</span>
      <span class="name">cezar</span>
      <span class="repo">cezar / main</span>
    </div>

    <div class="side-newtask">
      <button class="btn btn-newtask" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New task
      </button>
    </div>

    <nav class="side-section" aria-label="Main">
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11M3 12h11M3 18h11"/><path d="m17 7 2 2 3.5-3.5"/><path d="m17 17 2 2 3.5-3.5"/></svg>
        Tasks
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"/></svg>
        Inbox
        <span class="badge">2</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="6" r="2.6"/><path d="M6 8.6v6.8"/><path d="M18 8.6a9 9 0 0 1-9 6.8"/></svg>
        Git
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        GitHub
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 8.5 13.3 11l2.7 1-2.7 1L12 15.5 10.7 13 8 12l2.7-1Z"/></svg>
        Skills
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h5.5A1.5 1.5 0 0 1 17 8v6"/></svg>
        Workflows
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><circle cx="9" cy="6" r="2"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2"/></svg>
        Settings
      </button>
    </nav>

    <div class="side-label">Working</div>
    <div class="side-section">
      <button class="task-row">
        <span class="pill" style="padding:0"><span class="dot dot-pending dot-pulse"></span></span>
        <span class="t">Fix flaky worktree cleanup test</span>
        <span class="meta">2m</span>
      </button>
      <button class="task-row">
        <span class="pill" style="padding:0"><span class="dot dot-violet"></span></span>
        <span class="t">Migrate run store to event protocol v2</span>
        <span class="meta">14m</span>
      </button>
    </div>
    <div class="side-label">Recent</div>
    <div class="side-section">
      <button class="task-row">
        <span class="pill" style="padding:0"><span class="dot dot-success"></span></span>
        <span class="t">Add tests for inbox badge counts</span>
        <span class="meta">1h</span>
      </button>
      <button class="task-row">
        <span class="pill" style="padding:0"><span class="dot dot-neutral"></span></span>
        <span class="t">Bump playwright to 1.52</span>
        <span class="meta">3h</span>
      </button>
    </div>

    <div class="side-foot">
      <button class="chip tools-chip" title="claude 2.0.44 · codex 0.48.0 · gh 2.62 · git 2.43">
        <span class="dot dot-success"></span>Tools
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="ver">v0.9.2</span>
      <button class="theme-btn" aria-label="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </aside>

  <!-- ================= main ================= -->
  <main class="main">

    <!-- mobile top bar -->
    <header class="mobile-top">
      <button class="mt-btn" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="brand-tile" style="width:22px;height:22px;font-size:13px;border-radius:6px">c</span>
      <span class="mt-title">New task</span>
      <span class="mt-spacer"></span>
      <button class="mt-btn" aria-label="More">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
      </button>
    </header>

    <section class="hero">

      <!-- decorative twinkle -->
      <div class="twinkles" aria-hidden="true">
        <span class="tw tw-2 tw-lime"   style="top:6%;  left:14%; opacity:.5"></span>
        <span class="tw tw-3 tw-violet" style="top:11%; left:31%; opacity:.45"></span>
        <span class="tw tw-2 tw-yellow" style="top:8%;  left:52%; opacity:.4"></span>
        <span class="tw tw-2 tw-violet" style="top:15%; left:71%; opacity:.5"></span>
        <span class="tw tw-3 tw-lime"   style="top:9%;  left:86%; opacity:.4"></span>
        <span class="tw tw-2 tw-yellow" style="top:22%; left:8%;  opacity:.4"></span>
        <span class="tw tw-2 tw-lime"   style="top:27%; left:24%; opacity:.35"></span>
        <span class="tw tw-3 tw-yellow" style="top:20%; left:44%; opacity:.35"></span>
        <span class="tw tw-2 tw-violet" style="top:25%; left:62%; opacity:.4"></span>
        <span class="tw tw-2 tw-lime"   style="top:30%; left:79%; opacity:.35"></span>
        <span class="tw tw-3 tw-violet" style="top:36%; left:12%; opacity:.3"></span>
        <span class="tw tw-2 tw-yellow" style="top:42%; left:35%; opacity:.28"></span>
        <span class="tw tw-2 tw-lime"   style="top:47%; left:58%; opacity:.28"></span>
        <span class="tw tw-2 tw-violet" style="top:52%; left:88%; opacity:.25"></span>
        <span class="tw tw-3 tw-lime"   style="top:60%; left:29%; opacity:.22"></span>
      </div>

      <div class="composer-wrap">
        <div class="hero-head">
          <h1 class="hero-title">What should the agent work on?</h1>
          <p class="hero-sub">Runs in an isolated worktree — review everything before it lands.</p>
        </div>

        <!-- composer card -->
        <div class="composer-card">
          <textarea class="composer-input" rows="3" aria-label="Describe a task for the agent">Improve how tool results render in the run thread — collapsed summaries with expandable detail, like the best agent cockpits.</textarea>

          <div class="attach-row">
            <span class="attach-thumb">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-3.5-3.5a2 2 0 0 0-2.8 0L6 20"/></svg>
            </span>
            <span class="attach-name">tool-cards-ref.png</span>
            <button class="attach-x" aria-label="Remove attachment">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="controls">
            <div class="controls-left">
              <button class="chip active skill" aria-expanded="true" aria-haspopup="listbox">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 13.9 9.1 20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9Z"/><path d="M19 3v3M17.5 4.5h3"/></svg>
                om-spec-writing
                <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button class="chip">
                claude
                <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button class="chip">
                sonnet
                <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button class="chip">
                ×2 variants
                <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button class="chip">
                <span class="mono">base: main</span>
                <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>

              <!-- ===== skill picker dropdown (static, open) ===== -->
              <div class="skill-menu" role="listbox" aria-label="Skills and workflows">
                <div class="skill-search">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                  <input type="text" placeholder="search skills &amp; workflows…" aria-label="Search skills and workflows">
                </div>
                <div class="menu-group">
                  <div class="menu-label">Project skills</div>
                  <button class="menu-item selected" role="option" aria-selected="true">
                    <span class="mi-body">
                      <span class="mi-name">om-spec-writing</span>
                      <span class="mi-desc">Write and review feature specs to staff-engineer standards</span>
                    </span>
                    <svg class="mi-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                  </button>
                  <button class="menu-item" role="option">
                    <span class="mi-body">
                      <span class="mi-name">om-code-review</span>
                      <span class="mi-desc">Review a diff against correctness and security standards</span>
                    </span>
                  </button>
                  <button class="menu-item" role="option">
                    <span class="mi-body">
                      <span class="mi-name">om-auto-create-pr</span>
                      <span class="mi-desc">Run a task end-to-end and ship it as a PR</span>
                    </span>
                  </button>
                </div>
                <div class="menu-group">
                  <div class="menu-label">Global</div>
                  <button class="menu-item reg" role="option">
                    <span class="mi-body">
                      <span class="mi-name">verify</span>
                      <span class="mi-desc">Exercise a change end-to-end and observe behavior</span>
                    </span>
                  </button>
                  <button class="menu-item reg" role="option">
                    <span class="mi-body">
                      <span class="mi-name">code-review</span>
                      <span class="mi-desc">Review the current diff for bugs and cleanups</span>
                    </span>
                  </button>
                </div>
                <div class="menu-group">
                  <div class="menu-label">Workflows</div>
                  <button class="menu-item reg" role="option">
                    <span class="mi-body">
                      <span class="mi-name">quick-task</span>
                      <span class="mi-desc">Single step, no gates — fastest path to a diff</span>
                    </span>
                  </button>
                  <button class="menu-item reg" role="option">
                    <span class="mi-body">
                      <span class="mi-name">plan-then-do</span>
                      <span class="mi-desc">Plan review gate before implementation starts</span>
                    </span>
                  </button>
                </div>
              </div>
              <!-- ===== /dropdown ===== -->
            </div>

            <div class="controls-right">
              <button class="dictate" aria-label="Dictation">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
                Dictation
              </button>

              <div class="seg" role="radiogroup" aria-label="Run mode">
                <button role="radio" aria-checked="false">Start</button>
                <button class="plan-active" role="radio" aria-checked="true">Plan first</button>
              </div>

              <span class="submit-group">
